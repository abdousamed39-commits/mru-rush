<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MRU RUSH - By Samuel Gims</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#002366;color:#fff;overflow:hidden;height:100vh;display:flex;flex-direction:column;user-select:none}
.topbar{background:#fff;color:#002366;padding:8px 12px;display:flex;justify-content:space-between;align-items:center}
.topbar .brand{display:flex;align-items:center;gap:8px}
.topbar .brand img{width:42px;height:42px;object-fit:contain;border-radius:8px}
.topbar h1{font-size:17px;line-height:1}.topbar small{font-size:10px;color:#666}
.score-box{display:flex;gap:6px}
.pill{background:#002366;color:#fff;padding:6px 10px;border-radius:20px;font-weight:bold;font-size:13px}
.pill.gold{background:#ff9800}
#game{flex:1;position:relative;background:linear-gradient(#0088cc,#002366);overflow:hidden;touch-action:none}
#panier{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);font-size:64px;z-index:10}
.item{position:absolute;font-size:42px;z-index:5;line-height:1}
.controls{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;padding:0 10px 95px;pointer-events:none;z-index:20}
.controls button{pointer-events:auto;width:70px;height:70px;border-radius:50%;border:none;background:rgba(255,255,255,.9);font-size:30px}
#startScreen{position:absolute;inset:0;background:rgba(0,0,0,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;z-index:100}
#startScreen img{width:170px;max-width:80%;border-radius:16px;background:#fff;padding:6px}
.btn{padding:16px 28px;border:none;border-radius:12px;font-weight:bold;font-size:18px;cursor:pointer}
.btn-play{background:#ff9800;color:#fff}
.btn-again{background:#25D366;color:#fff}
#best{font-size:13px;background:#fff;color:#002366;padding:6px 12px;border-radius:20px}
</style>
</head>
<body>
<div class="topbar">
<div class="brand"><img src="logo.png" alt="MRU RUSH" onerror="this.style.display='none'"><div><h1>MRU RUSH</h1><small>By Samuel Gims</small></div></div>
<div class="score-box"><span class="pill" id="score">💰 0 MRU</span><span class="pill gold" id="lives">❤️❤️❤️</span></div>
</div>
<div id="game">
<div id="panier">🧺</div>
<div class="controls"><button id="btn-left">⬅️</button><button id="btn-right">➡️</button></div>
<div id="startScreen">
<img src="logo.png" alt="MRU RUSH - Samuel Gims" onerror="this.style.display='none'">
<h2 style="font-size:26px">💰 ATTRAPPE LES MRU</h2>
<p style="font-size:14px;line-height:1.5">Attrape les billets <b>💵</b> et les pièces <b>🪙</b><br>Évite les bombes <b>💣</b> !<br><br>👉 Téléphone : glisse ton doigt<br>👉 PC : flèches ← →</p>
<div id="best">🏆 Record : 0 MRU</div>
<button class="btn btn-play" id="btn-start">▶️ JOUER</button>
<p style="font-size:11px">Un jeu de Samuel Gims</p>
</div>
</div>
<script>
var game=document.getElementById('game');
var panier=document.getElementById('panier');
var scoreEl=document.getElementById('score');
var livesEl=document.getElementById('lives');
var startScreen=document.getElementById('startScreen');
var bestEl=document.getElementById('best');
var score=0, lives=3, playing=false, panierX=50, speed=2.2, spawnTimer=null;
var best=Number(localStorage.getItem('MRU_RUSH_BEST')||0);
bestEl.textContent='🏆 Record : '+best+' MRU';
function setPanier(){ var w=game.clientWidth; panier.style.left=(panierX/100*w)+'px'; }
function movePanier(dir){ panierX+=dir*6; if(panierX<5) panierX=5; if(panierX>95) panierX=95; setPanier(); }
document.getElementById('btn-left').addEventListener('touchstart',function(e){e.preventDefault(); movePanier(-1);});
document.getElementById('btn-right').addEventListener('touchstart',function(e){e.preventDefault(); movePanier(1);});
document.getElementById('btn-left').addEventListener('mousedown',function(){movePanier(-1);});
document.getElementById('btn-right').addEventListener('mousedown',function(){movePanier(1);});
var startX=0, startPanierX=50;
game.addEventListener('touchstart',function(e){ startX=e.touches[0].clientX; startPanierX=panierX; },{passive:true});
game.addEventListener('touchmove',function(e){ if(!playing) return; var dx=e.touches[0].clientX-startX; panierX=startPanierX + (dx/game.clientWidth*100); if(panierX<5) panierX=5; if(panierX>95) panierX=95; setPanier(); },{passive:true});
document.addEventListener('keydown',function(e){ if(!playing) return; if(e.key==='ArrowLeft') movePanier(-1); if(e.key==='ArrowRight') movePanier(1); });
function spawnItem(){
  if(!playing) return;
  var isBomb=Math.random()<0.18;
  var isCoin=Math.random()<0.3;
  var el=document.createElement('div');
  el.className='item';
  el.textContent=isBomb?'💣':(isCoin?'🪙':'💵');
  var x=Math.random()*85+5;
  el.style.left=x+'%'; el.style.top='-50px';
  game.appendChild(el);
  var y=-50; var val=isBomb?0:(isCoin?50:100);
  var fall=setInterval(function(){
    if(!playing){ clearInterval(fall); el.remove(); return; }
    y+=speed; el.style.top=y+'px';
    var panRect=panier.getBoundingClientRect(); var elRect=el.getBoundingClientRect();
    if(elRect.bottom>=panRect.top && elRect.top<=panRect.bottom && elRect.left>=panRect.left-20 && elRect.right<=panRect.right+20){
      clearInterval(fall); el.remove();
      if(isBomb){ lives--; livesEl.textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives); if(navigator.vibrate) navigator.vibrate(200); if(lives<=0) gameOver(); }
      else{ score+=val; scoreEl.textContent='💰 '+score+' MRU'; if(score>best){ best=score; localStorage.setItem('MRU_RUSH_BEST',best); } if(score%500===0) speed+=0.4; }
      return;
    }
    if(y>game.clientHeight){ clearInterval(fall); el.remove(); if(!isBomb){ lives--; livesEl.textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives); if(lives<=0) gameOver(); } }
  },16);
}
function startGame(){ score=0; lives=3; speed=2.2; playing=true; scoreEl.textContent='💰 0 MRU'; livesEl.textContent='❤️❤️❤️'; startScreen.style.display='none'; panierX=50; setPanier(); spawnTimer=setInterval(spawnItem,700); }
function gameOver(){ playing=false; clearInterval(spawnTimer); document.querySelectorAll('.item').forEach(function(i){i.remove();}); startScreen.style.display='flex'; startScreen.innerHTML='<img src="logo.png" style="width:130px;border-radius:12px;background:#fff;padding:4px" onerror="this.style.display=\'none\'"><h2>💥 GAME OVER</h2><p>Tu as attrapé <b>'+score+' MRU</b><br>Record : '+best+' MRU</p><div style="background:#fff;color:#002366;padding:6px 12px;border-radius:20px">🏆 Record : '+best+' MRU</div><button class="btn btn-again" onclick="location.reload()">🔁 REJOUER</button><p style="font-size:11px">MRU RUSH - By Samuel Gims</p>'; }
document.getElementById('btn-start').addEventListener('click',startGame);
window.addEventListener('resize',setPanier); setPanier();
</script>
</body>
</html>
